version: "3.1"

nlu:
- intent: greet
  examples: |
    - hallo
    - hi
    - servus
    - guten tag
    - hey
    - hallo bot
    - grüß dich
    - moin

- intent: goodbye
  examples: |
    - tschüss
    - auf wiedersehen
    - bis dann
    - ciao
    - bye
    - man sieht sich
    - danke, das wars

- intent: thanks
  examples: |
    - danke
    - vielen dank
    - super, danke dir
    - danke für die info
    - dankeschön
    - passt, danke

- intent: bot_challenge
  examples: |
    - bist du ein bot?
    - bist du ein mensch?
    - rede ich mit einem echten menschen?
    - bist du eine KI?
    - wer bist du?
    - was bist du?

- intent: ask_verhalten
  examples: |
    - wie muss ich mich in der schule benehmen
    - wie soll ich mich verhalten
    - gibt es regeln zum benehmen
    - muss ich mich höflich verhalten
    - was steht zum verhalten in der hausordnung
    - muss ich mich passend kleiden
    - gibt es eine kleiderordnung
    - was gilt für den umgang miteinander
    - muss man sich grüßen
    - ist gewalt erlaubt

- intent: ask_sprache
  examples: |
    - welche sprache muss ich in der schule sprechen
    - darf ich meine muttersprache sprechen
    - gibt es regeln zur sprache im unterricht
    - muss ich deutsch sprechen mit mitschülern
    - was gilt bei gesprächen mit mehreren personen
    - warum soll man eine gemeinsame sprache sprechen

- intent: ask_anwesenheitspflicht
